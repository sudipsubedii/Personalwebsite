<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Page not found — Sudip Subedi</title>
<meta name="theme-color" content="#0B1F33">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#F7F3EA;color:#0B1F33;font-family:Inter,system-ui,sans-serif}
main{width:min(100%,720px);padding:56px 32px;text-align:center;border:1px solid rgba(11,31,51,.12);border-radius:24px;background:rgba(255,253,247,.9);box-shadow:0 20px 60px rgba(11,31,51,.10)}
.eyebrow{font-size:.75rem;letter-spacing:.2em;font-weight:700;color:#B7985A}
h1{font:600 clamp(3rem,10vw,6rem)/.95 Fraunces,Georgia,serif;margin:12px 0}
p{line-height:1.7;color:#405163}
a{display:inline-flex;min-height:44px;align-items:center;padding:0 18px;border-radius:999px;background:#0B1F33;color:#F7F3EA;text-decoration:none;font-weight:700}
@media(prefers-color-scheme:dark){body{background:#081521;color:#F4EDE0}main{background:#0D1D2A;border-color:rgba(244,237,224,.1)}p{color:#C2CBD4}a{background:#D2B272;color:#081521}}
</style>
</head>
<body>
<main>
<div class="eyebrow">404 • NOT FOUND</div>
<h1>That page moved.</h1>
<p>The page you requested does not exist or is no longer at this address.</p>

</main>
